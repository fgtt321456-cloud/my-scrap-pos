<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>POS รับซื้อของเก่า - Minimal Cute Edition</title>
    <style>
        /* โทนสีมินิมอลนุ่มนวล (Soft Pastel Minimal Theme) */
        :root {
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --primary: #6C5CE7;
            --primary-soft: #A29BFE;
            --accent-green: #00B894;
            --accent-green-bg: #E8F8F5;
            --accent-red: #FF7675;
            --text-dark: #2D3436;
            --text-muted: #B2BEC3;
            --border-color: #EDF2F7;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Thai", "Chakra Petch", sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 16px; display: flex; flex-direction: column; gap: 16px; height: 100vh; overflow: hidden; }

        @media (min-width: 768px) {
            body { flex-direction: row; padding: 20px; gap: 20px; }
            .left-panel { flex: 1.2; display: flex; flex-direction: column; overflow: hidden; }
            .right-panel { flex: 1; display: flex; flex-direction: column; }
        }

        /* ส่วนหัวและแท็บเมนู */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { background: #E2E8F0; border: none; padding: 10px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; color: #4A5568; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .panel-header h2 { font-size: 18px; font-weight: 700; color: var(--text-dark); }
        .btn-sub { background: #EDF2F7; border: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-dark); }
        .btn-sub.active { background: #FDCB6E; color: #2D3436; }

        /* การ์ดสินค้ามินิมอล */
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 12px; overflow-y: auto; padding-bottom: 10px; }
        .product-card { 
            background: var(--card-bg); border-radius: var(--radius-md); padding: 10px; text-align: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); cursor: pointer; position: relative; transition: all 0.15s ease; border: 1px solid var(--border-color);
        }
        .product-card:active { transform: scale(0.96); }
        .product-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; }
        .product-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .product-card p { font-size: 13px; color: var(--accent-green); font-weight: 700; }
        
        .btn-remove-prod { display: none; position: absolute; top: -6px; right: -6px; background: var(--accent-red); color: white; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; line-height: 22px; text-align: center; font-size: 12px; }
        .edit-mode .btn-remove-prod { display: block; }

        /* ส่วนฝั่งขวา (ตารางคิดเงิน / หน้ารายงาน) */
        .right-panel { background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid var(--border-color); }
        
        .cart-container { flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        td { padding: 10px 2px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        
        .item-name { font-weight: 600; font-size: 14px; }
        input[type="number"], input[type="text"] { 
            padding: 8px; font-size: 15px; text-align: center; 
            border: 1px solid var(--border-color); border-radius: 8px; background: #F7FAFC; color: var(--text-dark); font-weight: 600;
        }
        input[type="number"] { width: 65px; }
        input:focus { outline: none; border-color: var(--primary-soft); background: #FFF; }

        .item-total { font-weight: 700; font-size: 15px; text-align: right; }
        .btn-delete { color: var(--accent-red); font-size: 18px; cursor: pointer; text-align: center; width: 28px; }

        /* ส่วนรวมเงินสุทธิ */
        .summary-card { background: var(--accent-green-bg); border-radius: var(--radius-md); padding: 14px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
        .summary-label { font-size: 14px; color: var(--accent-green); font-weight: 600; }
        .summary-amount { font-size: 28px; font-weight: 800; color: #006241; }

        .btn-pay { 
            background: var(--primary); color: #FFFFFF; border: none; width: 100%; padding: 16px; 
            border-radius: var(--radius-md); font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-pay:active { opacity: 0.9; transform: scale(0.98); }

        /* หน้าจอสรุปรายงาน (Report View) */
        .report-view { display: none; flex-direction: column; height: 100%; gap: 10px; }
        .report-actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-export { background: #E2E8F0; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .report-table-wrapper { flex-grow: 1; overflow-y: auto; }

        /* Modal หน้าต่างป๊อปอัพ */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; border-radius: var(--radius-lg); padding: 20px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content h3 { font-size: 16px; font-weight: 700; }
        .modal-content input { width: 100%; text-align: left; }
        .modal-btns { display: flex; gap: 8px; margin-top: 6px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #EDF2F7; color: var(--text-dark); }

        @media print {
            body { background: white; padding: 0; }
            .left-panel, .btn-pay, .btn-delete, .nav-tabs, th:last-child, td:last-child { display: none !important; }
            .right-panel { box-shadow: none; width: 100%; padding: 0; }
            input[type="number"] { border: none; background: transparent; padding: 0; width: 40px; text-align: left; }
        }
    </style>
</head>
<body>

    <!-- ฝั่งซ้าย: หน้าขาย/สินค้า -->
    <div class="left-panel">
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabPOS" onclick="switchView('pos')">🛒 หน้าขายรับซื้อ</button>
            <button class="tab-btn" id="tabReport" onclick="switchView('report')">📊 สรุปรายรับ-จ่าย (30 วัน)</button>
        </div>

        <div id="posLeftView">
            <div class="panel-header">
                <h2>รายการสินค้า</h2>
                <div>
                    <button class="btn-sub" id="btnEditMode" onclick="toggleEditMode()">⚙️ จัดการสินค้า</button>
                    <button class="btn-sub" id="btnAddProd" style="display:none; background:var(--primary); color:white;" onclick="openModal()">+ เพิ่ม</button>
                </div>
            </div>
            <div class="grid-products" id="productGrid"></div>
        </div>
    </div>

    <!-- ฝั่งขวา: ตารางคิดเงิน หรือ หน้ารายงาน -->
    <div class="right-panel">
        <!-- หน้าต่างคิดเงิน POS -->
        <div id="posRightView" style="display: flex; flex-direction: column; height: 100%;">
            <div class="panel-header">
                <h2>รายการคิดเงิน</h2>
            </div>
            
            <div class="cart-container">
                <table>
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th style="text-align: center;">น้ำหนัก (กก.)</th>
                            <th style="text-align: center;">ราคา/กก.</th>
                            <th style="text-align: right;">รวม (บาท)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody"></tbody>
                </table>
            </div>

            <div class="summary-card">
                <div class="summary-label">ยอดจ่ายสุทธิ</div>
                <div class="summary-amount"><span id="totalAmount">0.00</span> ฿</div>
            </div>
            <button class="btn-pay" onclick="completeTransaction()">บันทึกจ่ายเงิน & พิมพ์ใบเสร็จ</button>
        </div>

        <!-- หน้าต่างสรุปรายงาน (30 วัน) -->
        <div id="reportRightView" class="report-view">
            <div class="panel-header">
                <h2>สรุปยอดซื้อขายย้อนหลัง</h2>
            </div>

            <div class="report-actions">
                <button class="btn-export" onclick="setReportMode('daily')">📅 แยกตามวัน</button>
                <button class="btn-export" onclick="setReportMode('items')">📦 แยกตามสินค้า (กก./บาท)</button>
                <button class="btn-export" style="background:#00B894; color:white;" onclick="exportCSV('daily')">📥 โหลดรายงานวัน (CSV)</button>
                <button class="btn-export" style="background:#0984E3; color:white;" onclick="exportCSV('monthly')">📥 โหลดรายงานเดือน (CSV)</button>
            </div>

            <div class="report-table-wrapper">
                <table>
                    <thead>
                        <tr id="reportTh">
                            <!-- JS จะใส่หัวตารางตามโหมดที่เลือก -->
                        </tr>
                    </thead>
                    <tbody id="reportTb"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- หน้าต่างป๊อปอัพเพิ่มสินค้า -->
    <div class="modal" id="prodModal">
        <div class="modal-content">
            <h3>เพิ่มรายการสินค้าใหม่</h3>
            <label style="font-size: 12px; color: var(--text-muted);">ชื่อสินค้า</label>
            <input type="text" id="newProdName" placeholder="เช่น เหล็กหนา">
            
            <label style="font-size: 12px; color: var(--text-muted);">ราคารับซื้อ (บาท/กก.)</label>
            <input type="number" id="newProdPrice" step="0.5" inputmode="decimal" placeholder="0.00">
            
            <label style="font-size: 12px; color: var(--text-muted);">URL รูปภาพ</label>
            <input type="text" id="newProdImg" placeholder="วางลิงก์รูปภาพที่นี่">
            
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button class="btn-save" onclick="saveNewProduct()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // สินค้าตั้งต้น
        const defaultProducts = [
            { id: 1, name: 'เหล็กรวม', price: 10.0, img: 'https://images.unsplash.com/photo-1535813547-99c456a41d4a?w=300' },
            { id: 2, name: 'ทองแดง A', price: 260.0, img: 'https://images.unsplash.com/photo-1589792923962-537704632910?w=300' },
            { id: 3, name: 'กระดาษลัง', price: 4.5, img: 'https://images.unsplash.com/photo-1530587191325-3db32d826c18?w=300' },
            { id: 4, name: 'ขวด PET', price: 8.0, img: 'https://images.unsplash.com/photo-1562077772-3bd90403f7f0?w=300' },
            { id: 5, name: 'อลูมิเนียม', price: 45.0, img: 'https://images.unsplash.com/photo-1605557202138-097824c3f2c4?w=300' }
        ];

        let products = JSON.parse(localStorage.getItem('my_pos_products')) || defaultProducts;
        let historyData = JSON.parse(localStorage.getItem('my_pos_history')) || [];
        let cart = [];
        let isEditMode = false;
        let currentReportMode = 'daily';

        function saveStorage() {
            localStorage.setItem('my_pos_products', JSON.stringify(products));
            localStorage.setItem('my_pos_history', JSON.stringify(historyData));
        }

        // แสดงสินค้า
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                const defaultImg = 'https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=300';
                grid.innerHTML += `
                    <div class="product-card" onclick="onProductClick(${p.id})">
                        <span class="btn-remove-prod" onclick="deleteProduct(event, ${p.id})">✕</span>
                        <img src="${p.img || defaultImg}" alt="${p.name}" onerror="this.src='${defaultImg}'">
                        <h4>${p.name}</h4>
                        <p>฿${p.price}</p>
                    </div>
                `;
            });
        }

        // กดเลือกสินค้า / แก้ไขรูปและราคาในโหมดจัดการ
        function onProductClick(id) {
            if (isEditMode) {
                const prod = products.find(p => p.id === id);
                
                // 1. แก้ไขราคา
                const newPrice = prompt(`แก้ไขราคารับซื้อสำหรับ "${prod.name}" (บาท/กก.):`, prod.price);
                if (newPrice !== null && !isNaN(parseFloat(newPrice))) {
                    prod.price = parseFloat(newPrice);
                }

                // 2. เปลี่ยนลิงก์รูปภาพ
                const newImg = prompt(`วางลิงก์รูปภาพใหม่สำหรับ "${prod.name}":`, prod.img || '');
                if (newImg !== null) {
                    prod.img = newImg.trim();
                }

                saveStorage();
                renderProducts();
            } else {
                addToCart(id);
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btnEditMode');
            const btnAdd = document.getElementById('btnAddProd');
            const grid = document.getElementById('productGrid');

            if (isEditMode) {
                btn.innerText = 'เสร็จสิ้น';
                btn.classList.add('active');
                btnAdd.style.display = 'inline-block';
                grid.classList.add('edit-mode');
            } else {
                btn.innerText = '⚙️ จัดการสินค้า';
                btn.classList.remove('active');
                btnAdd.style.display = 'none';
                grid.classList.remove('edit-mode');
            }
        }

        function deleteProduct(e, id) {
            e.stopPropagation();
            if (confirm('ลบรายการสินค้านี้ใช่หรือไม่?')) {
                products = products.filter(p => p.id !== id);
                saveStorage();
                renderProducts();
            }
        }

        function openModal() { document.getElementById('prodModal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('prodModal').style.display = 'none';
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdPrice').value = '';
            document.getElementById('newProdImg').value = '';
        }

        function saveNewProduct() {
            const name = document.getElementById('newProdName').value.trim();
            const price = parseFloat(document.getElementById('newProdPrice').value);
            const img = document.getElementById('newProdImg').value.trim();

            if (!name || isNaN(price)) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            products.push({ id: Date.now(), name, price, img });
            saveStorage();
            renderProducts();
            closeModal();
        }

        // ระบบตารางคิดเงิน
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push({
                cartId: Date.now(),
                name: product.name,
                weight: 1,
                price: product.price
            });
            renderCart();
        }

        function updateCart(cartId, field, value) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item[field] = parseFloat(value) || 0;
                renderCart();
            }
        }

        function removeItem(cartId) {
            cart = cart.filter(i => i.cartId !== cartId);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            let grandTotal = 0;

            cart.forEach(item => {
                const total = item.weight * item.price;
                grandTotal += total;

                tbody.innerHTML += `
                    <tr>
                        <td class="item-name">${item.name}</td>
                        <td style="text-align: center;">
                            <input type="number" step="0.1" inputmode="decimal" value="${item.weight}" oninput="updateCart(${item.cartId}, 'weight', this.value)">
                        </td>
                        <td style="text-align: center;">
                            <input type="number" step="0.5" inputmode="decimal" value="${item.price}" oninput="updateCart(${item.cartId}, 'price', this.value)">
                        </td>
                        <td class="item-total">${total.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td class="btn-delete" onclick="removeItem(${item.cartId})">✕</td>
                    </tr>
                `;
            });

            document.getElementById('totalAmount').innerText = grandTotal.toLocaleString('th-TH', {minimumFractionDigits: 2});
        }

        // จ่ายเงิน + พิมพ์ใบเสร็จ + บันทึกประวัติ
        function completeTransaction() {
            if (cart.length === 0) {
                alert('กรุณาเลือกรายการสินค้าก่อนครับ');
                return;
            }

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            const monthStr = dateStr.substring(0, 7); // YYYY-MM

            let totalPayout = 0;
            const itemsBought = cart.map(i => {
                const sum = i.weight * i.price;
                totalPayout += sum;
                return { name: i.name, weight: i.weight, price: i.price, total: sum };
            });

            // พิมพ์สลิป
            window.print();

            // บันทึกประวัติลง LocalStorage
            historyData.push({
                id: Date.now(),
                date: dateStr,
                month: monthStr,
                items: itemsBought,
                totalPayout: totalPayout
            });

            saveStorage();
            cart = [];
            renderCart();
            alert('บันทึกการรับซื้อเรียบร้อยแล้ว');
        }

        // สลับมุมมอง (หน้าขาย vs หน้ารายงาน)
        function switchView(view) {
            document.getElementById('tabPOS').classList.toggle('active', view === 'pos');
            document.getElementById('tabReport').classList.toggle('active', view === 'report');

            document.getElementById('posRightView').style.display = view === 'pos' ? 'flex' : 'none';
            document.getElementById('reportRightView').style.display = view === 'report' ? 'flex' : 'none';

            if (view === 'report') renderReport();
        }

        function setReportMode(mode) {
            currentReportMode = mode;
            renderReport();
        }

        // คำนวณสรุปรายงานย้อนหลัง 30 วัน
        function renderReport() {
            const th = document.getElementById('reportTh');
            const tb = document.getElementById('reportTb');
            tb.innerHTML = '';

            // กรองประวัติเฉพาะ 30 วันล่าสุด
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            const recentHistory = historyData.filter(h => new Date(h.date) >= thirtyDaysAgo);

            if (currentReportMode === 'daily') {
                th.innerHTML = `<th>วันที่</th><th style="text-align:right;">ยอดรวมจ่ายออก (บาท)</th>`;
                
                // สรุปรายวัน
                const dailySummary = {};
                recentHistory.forEach(h => {
                    dailySummary[h.date] = (dailySummary[h.date] || 0) + h.totalPayout;
                });

                Object.keys(dailySummary).sort().reverse().forEach(date => {
                    tb.innerHTML += `
                        <tr>
                            <td><b>${date}</b></td>
                            <td style="text-align:right; font-weight:700; color:#00B894;">${dailySummary[date].toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</td>
                        </tr>
                    `;
                });
            } else if (currentReportMode === 'items') {
                th.innerHTML = `<th>รายการสินค้า</th><th style="text-align:center;">น้ำหนักรวม (กก.)</th><th style="text-align:right;">เงินรวม (บาท)</th>`;
                
                // สรุปแยกรายสินค้า
                const itemSummary = {};
                recentHistory.forEach(h => {
                    h.items.forEach(item => {
                        if (!itemSummary[item.name]) {
                            itemSummary[item.name] = { weight: 0, total: 0 };
                        }
                        itemSummary[item.name].weight += item.weight;
                        itemSummary[item.name].total += item.total;
                    });
                });

                Object.keys(itemSummary).forEach(name => {
                    tb.innerHTML += `
                        <tr>
                            <td><b>${name}</b></td>
                            <td style="text-align:center;">${itemSummary[name].weight.toLocaleString('th-TH', {minimumFractionDigits:1})} กก.</td>
                            <td style="text-align:right; font-weight:700; color:#00B894;">${itemSummary[name].total.toLocaleString('th-TH', {minimumFractionDigits:2})} ฿</td>
                        </tr>
                    `;
                });
            }
        }

        // ดาวน์โหลดรายงานเป็นไฟล์ CSV (นำไปเปิดใน Excel ได้)
        function exportCSV(type) {
            let csvContent = "\uFEFF"; // BOM รองรับภาษาไทยใน Excel
            
            if (type === 'daily') {
                csvContent += "วันที่,ยอดจ่ายสุทธิ(บาท)\n";
                const dailySummary = {};
                historyData.forEach(h => {
                    dailySummary[h.date] = (dailySummary[h.date] || 0) + h.totalPayout;
                });
                Object.keys(dailySummary).sort().forEach(date => {
                    csvContent += `"${date}",${dailySummary[date]}\n`;
                });
            } else if (type === 'monthly') {
                csvContent += "เดือน,ยอดจ่ายสุทธิ(บาท)\n";
                const monthlySummary = {};
                historyData.forEach(h => {
                    monthlySummary[h.month] = (monthlySummary[h.month] || 0) + h.totalPayout;
                });
                Object.keys(monthlySummary).sort().forEach(m => {
                    csvContent += `"${m}",${monthlySummary[m]}\n`;
                });
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `สรุปยอด_${type}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // เริ่มต้นทำงาน
        renderProducts();
        renderCart();
    </script>
</body>
</html>
