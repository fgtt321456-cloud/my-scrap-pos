<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับซื้อขยะรีไซเคิล - หจก.รุ่งนภา รีไซเคิล</title>
    <!-- Firebase SDK for Real-time Data Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Sukhumvit Set', 'Takhoma', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #e6f4ea; color: #137333; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #34a853; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .btn-primary { background: #5c52e5; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-primary:hover { background: #4b42cc; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>♻️ หจก.รุ่งนภา รีไซเคิล <span class="status-badge"><span class="status-dot"></span> Live Sync Real-time</span></h2>
    
    <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h3>💵 เงินสดคงเหลือในเก๊ะ: <span id="cashInDrawer" style="color: #2b8a3e; font-size: 24px;">0.00</span> ฿</h3>
        <button class="btn-primary" onclick="openConfigModal()">⚙️ ตั้งงบเก๊ะ & ตั้งค่า LINE Webhook</button>
    </div>

    <!-- ฟอร์มรับซื้อขยะ -->
    <div>
        <h3>📝 บันทึกการรับซื้อ</h3>
        <label>ยอดเงินจ่ายซื้อ (บาท):</label>
        <input type="number" id="payoutAmount" placeholder="0.00">
        <br><br>
        <button class="btn-primary" style="background: #2b8a3e;" onclick="processTransaction()">จ่ายเงิน & บันทึกรายการ</button>
    </div>
</div>

<script>
    // -----------------------------------------------------------------
    // 1. ตั้งค่า Firebase Real-time Database (เชื่อมต่อทุกเครื่องตรงกัน)
    // -----------------------------------------------------------------
    const firebaseConfig = {
        databaseURL: "https://YOUR_FIREBASE_DATABASE_URL.firebaseio.com" // ใส่ Database URL ของ Firebase คุณที่นี่
    };
    
    // Check if Firebase is initialized
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // -----------------------------------------------------------------
    // 2. ระบบ Real-time Sync (อัปเดตข้ามเครื่องทันทีเมื่อมีการเปลี่ยนแปลง)
    // -----------------------------------------------------------------
    const drawerRef = db.ref('pos_settings/drawer_config');

    drawerRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('cashInDrawer').innerText = Number(data.currentCash || 0).toLocaleString('th-TH', {minimumFractionDigits: 2});
            
            // เก็บค่าไว้ใช้คำนวณในเครื่อง
            window.posConfig = data;
        }
    });

    // -----------------------------------------------------------------
    // 3. ฟังก์ชันบันทึกการรับซื้อ และส่งการแจ้งเตือน (ส่งค่า Payload แบบ Safe)
    // -----------------------------------------------------------------
    async function processTransaction() {
        const amountInput = document.getElementById('payoutAmount');
        const payout = parseFloat(amountInput.value);

        if (!payout || payout <= 0) {
            alert('กรุณาระบุยอดเงินจ่ายซื้อให้ถูกต้อง');
            return;
        }

        const config = window.posConfig || {};
        let currentCash = config.currentCash || 0;
        const lowCashThreshold = config.lowCashThreshold || 5000;
        const largeBillThreshold = config.largeBillThreshold || 10000;
        const webhookUrl = config.webhookUrl;

        // หักเงินออกจากเก๊ะ
        currentCash -= payout;

        // อัปเดตไปยัง Firebase Real-time (ส่งผลทันทีทุกเครื่องที่เปิด POS อยู่)
        await drawerRef.update({ currentCash: currentCash });
        amountInput.value = '';

        // --- ระบบแจ้งเตือน LINE Webhook ---
        let alertMessages = [];

        // เช็กเตือนบิลใหญ่
        if (payout >= largeBillThreshold) {
            alertMessages.push(`🚨 **แจ้งเตือนบิลจ่ายใหญ่!**\nยอดจ่ายรับซื้อ: ${payout.toLocaleString()} บาท`);
        }

        // เช็กเตือนเงินในเก๊ะต่ำกว่าเกณฑ์
        if (currentCash <= lowCashThreshold) {
            alertMessages.push(`⚠️ **เตือนเงินสดในลิ้นชักใกล้หมด!**\nเงินคงเหลือในเก๊ะ: ${currentCash.toLocaleString()} บาท (ต่ำกว่าเกณฑ์ ${lowCashThreshold.toLocaleString()} บาท)`);
        }

        // ยิง Webhook ไปยัง Make.com หากเข้าเงื่อนไข
        if (alertMessages.length > 0 && webhookUrl) {
            const fullMessage = alertMessages.join("\n\n") + `\n⏰ เวลา: ${new Date().toLocaleTimeString('th-TH')}`;
            
            // ส่งทั้ง Key 'value' และ 'message' เพื่อป้องกัน Bug เรื่องชื่อตัวแปร
            sendWebhookAlert(webhookUrl, fullMessage);
        }

        alert('บันทึกการจ่ายเงินเรียบร้อยแล้ว!');
    }

    // ฟังก์ชันส่งข้อมูลไปยัง Make.com (ป้องกัน CORS และล็อกโครงสร้างข้อมูล)
    function sendWebhookAlert(url, textMessage) {
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                value: textMessage,     // รองรับ {{2.value}} ใน Make.com
                message: textMessage   // รองรับ {{2.message}} ใน Make.com
            })
        }).catch(err => console.error("Webhook Send Error:", err));
    }

    // -----------------------------------------------------------------
    // 4. บันทึกการตั้งค่างบเงินสด / เกณฑ์การแจ้งเตือน
    // -----------------------------------------------------------------
    function openConfigModal() {
        const config = window.posConfig || {};
        const newCash = prompt("ระบุงบเงินสดเริ่มต้นในเก๊ะ (บาท):", config.currentCash || 0);
        const lowThreshold = prompt("ตั้งค่าเตือนเงินในเก๊ะต่ำกว่า (บาท):", config.lowCashThreshold || 5000);
        const largeThreshold = prompt("ตั้งค่าเตือนบิลใหญ่เกินกว่า (บาท):", config.largeBillThreshold || 10000);
        const webhook = prompt("วาง LINE Webhook URL (จาก Make.com):", config.webhookUrl || "");

        if (newCash !== null) {
            drawerRef.set({
                currentCash: parseFloat(newCash) || 0,
                lowCashThreshold: parseFloat(lowThreshold) || 5000,
                largeBillThreshold: parseFloat(largeThreshold) || 10000,
                webhookUrl: webhook ? webhook.trim() : ""
            });
            alert('บันทึกการตั้งค่าลงระบบเรียบร้อยแล้ว ทุกเครื่องจะอัปเดตข้อมูลทันที!');
        }
    }
</script>

</body>
</html>
