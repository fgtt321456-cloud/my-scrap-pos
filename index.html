<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>POS หจก.รุ่งนภา รีไซเคิล (Online Auto-Sync)</title>
    
    <!-- Firebase Real-time SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap');

        :root {
            --apple-blue: #007aff;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --apple-bg: #f2f2f7;
            --apple-card: #ffffff;
            --apple-text: #000000;
            --apple-subtext: #8e8e93;
            --apple-border: #c6c6c8;
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; font-family: -apple-system, 'SF Pro Display', 'Prompt', sans-serif; }
        body { background-color: var(--apple-bg); color: var(--apple-text); margin: 0; padding: calc(var(--sat) + 10px) 12px 12px 12px; font-size: 15px; }

        .app-container { max-width: 1280px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); padding: 12px 18px; border-radius: 18px; border: 0.5px solid rgba(0,0,0,0.1); margin-bottom: 12px; }
        .brand { font-size: 17px; font-weight: 700; }
        .cash-badge { background: #e5f1ff; color: var(--apple-blue); padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .pos-layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 12px; }
        @media (max-width: 850px) { .pos-layout { grid-template-columns: 1fr; } }

        .panel { background: var(--apple-card); border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.08); padding: 16px; margin-bottom: 12px; }
        .panel-title { font-size: 14px; font-weight: 600; color: var(--apple-subtext); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 520px; overflow-y: auto; }
        .prod-card { background: #fff; border: 1.5px solid #e5e5ea; border-radius: 16px; padding: 10px; text-align: center; cursor: pointer; }
        .prod-card.selected { border-color: var(--apple-blue); background: #f2f8ff; }
        .prod-img { width: 100%; height: 70px; object-fit: cover; border-radius: 10px; pointer-events: none; }
        .prod-name { font-size: 12px; font-weight: 600; pointer-events: none; }
        .prod-price { font-size: 13px; font-weight: 700; color: var(--apple-blue); pointer-events: none; }

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .field { display: flex; flex-direction: column; gap: 3px; }
        .field label { font-size: 11px; font-weight: 600; color: var(--apple-subtext); }
        .field input { padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 12px; font-size: 16px; font-weight: 600; background: #fafafa; }

        .subtotal-box { background: #eefbf1; border: 1px solid #c7f3d6; padding: 10px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .subtotal-val { font-size: 20px; font-weight: 700; color: var(--apple-green); }

        .btn { border: none; padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-add { background: var(--apple-blue); color: white; }
        .btn-pay { background: var(--apple-green); color: white; font-size: 16px; padding: 14px; margin-top: 10px; }

        .cart-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        .cart-table th { text-align: left; padding: 6px 8px; color: var(--apple-subtext); border-bottom: 0.5px solid var(--apple-border); }
        .cart-table td { padding: 8px; border-bottom: 0.5px solid var(--apple-border); font-weight: 500; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="brand">♻️ หจก.รุ่งนภา รีไซเคิล (Online System)</div>
        <div class="cash-badge">💵 เก๊ะ: <span id="cashInDrawer">0.00</span> ฿</div>
    </div>

    <div class="pos-layout">
        <div>
            <div class="panel">
                <div class="panel-title">
                    <span>📦 เลือกสินค้า (ด้านซ้าย)</span>
                    <span style="font-size: 12px; color: var(--apple-blue); font-weight: 700;" id="selectedProdNameText">กรุณาเลือกสินค้า</span>
                </div>
                <div class="product-grid" id="productGrid"></div>
            </div>

            <div class="panel">
                <div class="panel-title">🏷️ เพิ่มรายการ / ปรับราคาสินค้า</div>
                <input type="hidden" id="editingProdId" value="">
                <div style="display: grid; grid-template-columns: 2fr 1fr 2fr auto; gap: 6px; margin-bottom: 10px;">
                    <input type="text" id="newProdName" placeholder="ชื่อสินค้า">
                    <input type="number" id="newProdPrice" placeholder="ราคา/กก." step="any" inputmode="decimal">
                    <input type="text" id="newProdImg" placeholder="URL รูปภาพ">
                    <button class="btn btn-add" style="padding:8px 14px;" onclick="saveProduct()">บันทึก</button>
                </div>
                <div style="max-height: 140px; overflow-y: auto;">
                    <table class="cart-table">
                        <thead><tr><th>รูป</th><th>ชื่อสินค้า</th><th>ราคา/กก.</th><th>จัดการ</th></tr></thead>
                        <tbody id="managerProductTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">⚖️ คำนวณน้ำหนัก (ด้านขวา)</div>
            
            <div class="input-group">
                <div class="field"><label>ชั่งรวม (กก.)</label><input type="number" id="grossWeight" placeholder="0.00" step="any" inputmode="decimal" oninput="calcNet()"></div>
                <div class="field"><label>หักปนเปื้อน (กก.)</label><input type="number" id="deductWeight" placeholder="0" step="any" inputmode="decimal" oninput="calcNet()"></div>
            </div>

            <div class="input-group">
                <div class="field"><label>น้ำหนักสุทธิ (กก.)</label><input type="number" id="netWeight" placeholder="0.00" readonly></div>
                <div class="field"><label>ราคา/กก. (บาท)</label><input type="number" id="unitPrice" placeholder="0.00" readonly></div>
            </div>

            <div class="subtotal-box">
                <span style="font-weight: 600; color: var(--apple-subtext);">รวมเป็นเงิน</span>
                <span class="subtotal-val" id="subtotalText">0.00 ฿</span>
            </div>

            <button class="btn btn-add" onclick="addToCart()">➕ เพิ่มรายการลงบิล</button>

            <div style="margin-top: 12px; max-height: 160px; overflow-y: auto;">
                <table class="cart-table">
                    <thead><tr><th>รายการ</th><th class="text-right">สุทธิ</th><th class="text-right">รวม (฿)</th><th></th></tr></thead>
                    <tbody id="cartTable"><tr><td colspan="4" style="text-align:center; color:#8e8e93;">ยังไม่มีรายการ</td></tr></tbody>
                </table>
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:10px; font-weight:700; font-size:16px;">
                <span>ยอดรวมทั้งสิ้น:</span>
                <span id="grandTotal" style="color:var(--apple-blue);">0.00 ฿</span>
            </div>

            <button class="btn btn-pay" onclick="processPayment()">💵 จ่ายเงิน & บันทึกออนไลน์</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://YOUR_FIREBASE_DATABASE_URL.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentProduct = null;
    let cart = [];
    window.productList = [];

    db.ref('pos_settings/drawer_config').on('value', snap => {
        const data = snap.val() || {};
        document.getElementById('cashInDrawer').innerText = (parseFloat(data.currentCash) || 0).toLocaleString('th-TH', {minimumFractionDigits: 2});
        window.posConfig = data;
    });

    db.ref('products').on('value', snap => {
        const data = snap.val();
        if (data) {
            window.productList = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        }
        renderProducts();
        renderManagerProducts();
    });

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        window.productList.forEach(p => {
            grid.innerHTML += `
                <div class="prod-card" onclick="selectProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, this)">
                    <img src="${p.img}" class="prod-img" onerror="this.src='https://via.placeholder.com/100?text=Recycle'">
                    <div class="prod-name">${p.name}</div>
                    <div class="prod-price">${parseFloat(p.price).toFixed(2)} ฿</div>
                </div>`;
        });
    }

    function selectProduct(id, name, price, el) {
        document.querySelectorAll('.prod-card').forEach(c => c.classList.remove('selected'));
        if(el) el.classList.add('selected');
        currentProduct = { id, name, price: parseFloat(price) };
        document.getElementById('selectedProdNameText').innerText = "เลือก: " + name + " (" + price.toFixed(2) + " ฿)";
        document.getElementById('unitPrice').value = price.toFixed(2);
        calcNet();
    }

    function calcNet() {
        const gross = parseFloat(document.getElementById('grossWeight').value) || 0;
        const deduct = parseFloat(document.getElementById('deductWeight').value) || 0;
        const price = parseFloat(document.getElementById('unitPrice').value) || 0;
        let net = gross - deduct; if (net < 0) net = 0;
        const subtotal = net * price;
        document.getElementById('netWeight').value = net.toFixed(2);
        document.getElementById('subtotalText').innerText = subtotal.toLocaleString('th-TH', {minimumFractionDigits: 2}) + " ฿";
    }

    function addToCart() {
        if (!currentProduct) return alert('กรุณาเลือกรายการสินค้า');
        const net = parseFloat(document.getElementById('netWeight').value) || 0;
        if (net <= 0) return alert('ระบุน้ำหนักให้ถูกต้อง');
        cart.push({ name: currentProduct.name, net, price: currentProduct.price, subtotal: net * currentProduct.price });
        renderCart();
        document.getElementById('grossWeight').value = "";
        document.getElementById('deductWeight').value = "";
        document.getElementById('netWeight').value = "";
        document.getElementById('subtotalText').innerText = "0.00 ฿";
    }

    function renderCart() {
        const tbody = document.getElementById('cartTable');
        tbody.innerHTML = "";
        let total = 0;
        if (cart.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#8e8e93;">ยังไม่มีรายการ</td></tr>';
            document.getElementById('grandTotal').innerText = "0.00 ฿";
            return;
        }
        cart.forEach((item, idx) => {
            total += item.subtotal;
            tbody.innerHTML += `<tr><td>${item.name}</td><td class="text-right">${item.net.toLocaleString()}</td><td class="text-right">${item.subtotal.toLocaleString('th-TH', {minimumFractionDigits:2})}</td><td class="text-right"><button onclick="cart.splice(${idx},1);renderCart();" style="background:none;border:none;color:var(--apple-red);font-weight:bold;">✕</button></td></tr>`;
        });
        document.getElementById('grandTotal').innerText = total.toLocaleString('th-TH', {minimumFractionDigits: 2}) + " ฿";
    }

    async function processPayment() {
        if (cart.length === 0) return alert('ยังไม่มีรายการ');
        const total = cart.reduce((s, i) => s + i.subtotal, 0);
        const config = window.posConfig || {};
        let currentCash = parseFloat(config.currentCash) || 0;

        if (confirm(`ยืนยันจ่ายเงิน ${total.toLocaleString()} บาท?`)) {
            currentCash -= total;
            await db.ref('pos_settings/drawer_config').update({ currentCash });

            const today = new Date().toISOString().split('T')[0];
            // บันทึกลง Cloud Database สำหรับการตัดยอดเวลา 23:59 น.
            await db.ref('daily_records/' + today).push({
                timestamp: Date.now(),
                total: total,
                items: cart
            });

            alert('บันทึกยอดรับซื้อลงระบบออนไลน์เรียบร้อยแล้ว');
            cart = [];
            renderCart();
        }
    }

    function renderManagerProducts() {
        const tbody = document.getElementById('managerProductTable'); tbody.innerHTML = "";
        window.productList.forEach(p => {
            tbody.innerHTML += `<tr><td><img src="${p.img}" width="30" height="30" style="object-fit:cover;border-radius:6px;"></td><td>${p.name}</td><td>${parseFloat(p.price).toFixed(2)}</td><td><button onclick="db.ref('products/${p.id}').remove()" style="color:var(--apple-red);border:none;background:none;font-weight:bold;">ลบ</button></td></tr>`;
        });
    }

    function saveProduct() {
        const name = document.getElementById('newProdName').value.trim();
        const price = parseFloat(document.getElementById('newProdPrice').value);
        const img = document.getElementById('newProdImg').value.trim() || "https://images.unsplash.com/photo-1530587191325-3db32d826c18?w=200";
        if (name && !isNaN(price)) {
            db.ref('products').push().set({ name, price, img });
            document.getElementById('newProdName').value = "";
            document.getElementById('newProdPrice').value = "";
            document.getElementById('newProdImg').value = "";
        }
    }
</script>
</body>
</html>
